apiVersion: v1
kind: ServiceAccount
metadata:
  name: todoapp-sa
  namespace: todoapp

---

apiVersion: rca.authorization.k8s.io/v1
kind: Role
metadata:
  name: secrets-reader
  namespace: todoapp
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs:
      ["list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBiding
metadata:
  name: secrets-reader-binding
  namespace: todoapp
subjects:
  kind: ServiceAccount
  name: todoapp-sa
  namespace: todoapp
  roleRef:
    kind: Role
    name: secrets-reader
    apiGroups: rbac.authorization.k8s.io